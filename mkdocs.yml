site_name: qdt — Quantum Dot Toolkit
site_url: https://cowboyquantum.github.io/qdt
repo_url: https://github.com/cowboyquantum/qdt
nav:
  - Home: index.md
  - Development plan: DEVELOPMENT_PLAN.md
  - Status: STATUS.md
  - Steps: steps/README.md
  - Finish line (Flight Deck): FINISH_LINE.md
  - Bench: BENCH.md
  - ADRs: adr/README.md
  - Analyses:
      - analysis/0001-stream-budget.md
      - analysis/0002-renderer-benchmark.md
      - analysis/0003-registry-deployment-requirements.md
      - analysis/0004-pulse-scope-and-custom-isa.md
      - analysis/0005-system-snapshot.md
      - analysis/0006-agent-tuneup-roadmap.md
      - analysis/0007-phantom-as-the-simulation-backend.md
  - Probes: probes/01-stream-semantics.md
  - Guides:
      - guides/simulated-stand.md
  - Tutorials: tutorials/README.md
  - API: api.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [packages/qdt-schemas/src, packages/qdt-lab/src, packages/qdt-server/src, packages/qdt-tuning/src]
theme:
  name: material
