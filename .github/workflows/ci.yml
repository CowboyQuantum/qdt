name: ci
on: [push, pull_request]
jobs:
  l0:
    runs-on: ubuntu-latest
    services:
      postgres:  # ephemeral registry server for the Postgres half of the qdt-registry suite (Step 3)
        image: postgres:17.6
        env:
          POSTGRES_USER: qdt
          POSTGRES_PASSWORD: qdt
          POSTGRES_DB: qdt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qdt -d qdt_test" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      QDT_TEST_PG_DSN: postgresql+psycopg://qdt:qdt@127.0.0.1:5432/qdt_test
      QDT_TEST_PG_READER_DSN: postgresql+psycopg://qdt_reader:reader@127.0.0.1:5432/qdt_test  # tutorial 04 reads as the reader role
      QDT_WALLCLOCK_ADVISORY: "1"  # wall-clock rate tests warn below target, fail only below half (ADR 0039)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-packages --all-extras
      - name: registry roles on the ephemeral server (deploy/qdt-db/roles.sql, as the lab PC runs it)
        run: |
          psql postgresql://qdt:qdt@127.0.0.1:5432/qdt_test -v ON_ERROR_STOP=1 -v db=qdt_test -v admin_pw=admin -v writer_pw=writer -v reader_pw=reader -f deploy/qdt-db/roles.sql
          # the suite creates its tables as `qdt`, not as qdt_admin: give the reader those too
          psql postgresql://qdt:qdt@127.0.0.1:5432/qdt_test -v ON_ERROR_STOP=1 -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO qdt_reader"
      - run: bash scripts/check_all.sh
      - run: uv run pytest -q
  extras-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extra: ["none", "opx", "qdac", "keysight", "smu"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: |
          if [ "${{ matrix.extra }}" = "none" ]; then uv sync --package qdt-lab; else uv sync --package qdt-lab --extra "${{ matrix.extra }}"; fi
      - run: uv run python -c "import qdt_lab; print('import ok')"
  flightdeck:
    runs-on: ubuntu-latest
    defaults:
      run:
        # corepack resolves `packageManager` from the cwd's package.json; from the repo root it would
        # fetch the latest pnpm instead of the pinned one
        working-directory: apps/flightdeck
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-packages  # the end-to-end test runs the Python stream server from .venv
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:types  # generated TS types match the JSON Schema export
      - run: pnpm check:api  # generated API types match qdt-server's OpenAPI export
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e  # GPU pixels vs CPU reference in the runner's Chrome (SwiftShader)
      # Analysis 0001 targets, live from the Python stream server: 2048² at 10^6 pts/s. On shared runners both
      # targets are advisory: latency swung 78–334 ms (ADR 0014) and the rendered rate 925k–986k pts/s on
      # identical code (ADR 0039). The step still fails below half the rate: a broken renderer, not a slow runner.
      # Evidence for the targets: apps/flightdeck/bench/results/ (Analysis 0002).
      - run: pnpm bench --size 2048 --renderers webgl2 --gpu swiftshader --assert --latency-advisory --rate-advisory
