[project]
name = "qdt-schemas"
version = "0.1.0"
description = "qdt — shared pydantic schemas; root of the dependency tree"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
hdf5 = ["h5py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdt_schemas"]
