[project]
name = "qdt-sim"
version = "0.1.0"
description = "qdt — physics models; SimulatedDevice behind qdt-lab protocols"
requires-python = ">=3.11,<3.14"
dependencies = [
  "qdt-schemas",
  "qdt-lab",
  "qdt-tuning",
  "phantom==0.6.0",
  "numpy>=1.26,<3",
  "scipy",
  "xarray>=2024.1,<2027",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdt_sim"]
