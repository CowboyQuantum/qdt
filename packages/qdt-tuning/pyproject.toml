[project]
name = "qdt-tuning"
version = "0.1.0"
description = "qdt — calibration nodes as data and curated decision rules (Step 6, ADR 0048); pure"
requires-python = ">=3.11,<3.14"
dependencies = ["qdt-schemas", "numpy>=1.26,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdt_tuning"]
