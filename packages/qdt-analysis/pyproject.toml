[project]
name = "qdt-analysis"
version = "0.1.0"
description = "qdt — pure-functional analysis: records in, AnalysisResult out (no I/O)"
requires-python = ">=3.11,<3.14"
dependencies = ["qdt-schemas", "numpy>=1.26,<3", "scipy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdt_analysis"]
