[project]
name = "qdt-telemetry"
version = "0.1.0"
description = "qdt — cryo telemetry collector (Step 7)"
requires-python = ">=3.11,<3.14"
dependencies = ["qdt-schemas", "qdt-registry"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdt_telemetry"]
