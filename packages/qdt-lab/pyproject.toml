[project]
name = "qdt-lab"
version = "0.1.0"
description = "qdt — instrument capability protocols, drivers, simulated backends, experiment executor, Dataset stream server"
requires-python = ">=3.11,<3.14"
dependencies = ["qdt-schemas", "numpy>=1.26,<3", "xarray>=2024.1,<2027"]

[project.optional-dependencies]
opx = []       # TODO Step 1: qm-qua, pinned after checking its pydantic/numpy constraints (ADR 0006)
qdac = []      # TODO Step 1: qcodes + QDAC-II driver
keysight = []  # TODO Step 1: pyvisa (+ backend)
smu = []       # TODO Step 1: pyvisa or vendor SDK

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdt_lab"]
