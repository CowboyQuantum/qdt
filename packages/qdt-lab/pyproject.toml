[project]
name = "qdt-lab"
version = "0.1.0"
description = "qdt — instrument capability protocols, drivers, simulated backends, experiment executor, Dataset stream server"
requires-python = ">=3.11,<3.14"
dependencies = [
    "qdt-schemas[hdf5]",  # a recorded run is a qdt-hdf5-v1 payload (ADR 0023)
    "numpy>=1.26,<3",
    "xarray>=2024.1,<2027",
    "pyarrow>=15",
    "websockets>=13",
]

[project.optional-dependencies]
opx = ["qm-qua>=1.2"]                            # OPX1000: QUA programs + config (ADR 0006)
qdac = ["pyvisa>=1.13", "pyvisa-py>=0.7", "pyserial>=3.5"]  # QDAC-II: SCPI over TCP, or the USB serial port
keysight = ["pyvisa>=1.13", "pyvisa-py>=0.7"]    # InfiniiVision X: SCPI
smu = ["pyvisa>=1.13", "pyvisa-py>=0.7"]         # Keithley 2400-series: SCPI

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdt_lab"]
