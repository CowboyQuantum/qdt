[project]
name = "qdt-frameworks"
version = "0.1.0"
description = "qdt — schema-validated renderers; no instance data (Step 8)"
requires-python = ">=3.11,<3.14"
dependencies = ["qdt-schemas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdt_frameworks"]
